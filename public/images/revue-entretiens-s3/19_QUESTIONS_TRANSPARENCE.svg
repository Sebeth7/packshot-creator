te territorial.</text><text fill="#6B7582" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start" x="250" y="843">Ne jamais conclure « toute IA = mention » ou « aucune mention ».</text><text fill="#6B7582" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="13" font-weight="normal" letter-spacing="1" text-anchor="start" x="80" y="879">SCHÉMA ÉDITORIAL · NON CONTRACTUEL · NE REPRÉSENTE PAS UNE INTERFACE ORBITVU</text></svg>