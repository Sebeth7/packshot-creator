tion Sans, sans-serif" font-size="13" font-weight="normal" letter-spacing="1" text-anchor="start" x="80" y="879">SCHÉMA ÉDITORIAL · NON CONTRACTUEL · NE REPRÉSENTE PAS UNE INTERFACE ORBITVU</text></svg>